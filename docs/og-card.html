<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:
      radial-gradient(720px 400px at 26% 20%, rgba(133,153,0,.12), transparent 60%),
      radial-gradient(520px 420px at 96% 90%, rgba(181,137,0,.10), transparent 60%),
      #fdf6e3;
    color:#586e75;font-family:'Spline Sans Mono',monospace;position:relative}
  .grid{position:absolute;inset:0;display:flex;align-items:center;gap:66px;padding:0 92px}
  .logo{flex:0 0 auto;width:300px;height:300px;border-radius:66px;
    filter:drop-shadow(0 22px 48px rgba(88,110,117,.4))}
  .txt{flex:1}
  .word{font-family:'Spline Sans Mono';font-weight:700;font-size:104px;letter-spacing:2px;color:#073642;line-height:1}
  .word .u{color:#b58900}
  .tag{font-size:34px;color:#859900;margin-top:26px;font-weight:600;line-height:1.25}
  .sub{font-size:23px;color:#657b83;margin-top:18px}
  .chips{margin-top:28px;display:flex;gap:12px}
  .chip{border:1px solid #ded6c0;background:#eee8d5;border-radius:8px;padding:8px 16px;font-size:20px;color:#586e75}
</style></head>
<body>
  <div class="grid">
    <svg class="logo" viewBox="0 0 256 256">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#eee8d5"/></linearGradient></defs>
      <rect width="256" height="256" rx="56" fill="url(#g)"/>
      <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#586e75" stroke-opacity="0.18" stroke-width="3"/>
      <circle cx="44" cy="42" r="7" fill="#dc322f"/><circle cx="68" cy="42" r="7" fill="#b58900"/><circle cx="92" cy="42" r="7" fill="#859900"/>
      <line x1="32" y1="66" x2="224" y2="66" stroke="#93a1a1" stroke-width="2"/>
      <path d="M40 82 L55 96 L40 110" fill="none" stroke="#586e75" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="64" y="104" width="28" height="8" rx="4" fill="#586e75"/>
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M40 157.6 L130 194" stroke="#586e75" stroke-width="6"/><path d="M40 230.4 L130 194" stroke="#586e75" stroke-width="6"/>
        <path d="M130 194 L185.3 171.7" stroke="#586e75" stroke-width="9"/><path d="M130 194 L185.3 216.3" stroke="#586e75" stroke-width="9"/>
        <circle cx="202" cy="164.9" r="15" stroke="#dc322f" stroke-width="10"/><circle cx="202" cy="223.1" r="15" stroke="#dc322f" stroke-width="10"/>
        <path d="M40 157.6 L52.1 162.5" stroke="#b58900" stroke-width="6"/><path d="M40 230.4 L52.1 225.5" stroke="#859900" stroke-width="6"/>
      </g>
      <circle cx="130" cy="194" r="9" fill="#586e75"/><circle cx="130" cy="194" r="3.5" fill="#fdf6e3"/>
    </svg>
    <div class="txt">
      <div class="word">clipper<span class="u">_</span></div>
      <div class="tag">The Flipper Zero CLI — over Bluetooth.</div>
      <div class="sub">Like screen /dev/cu.usbmodem*, but cordless.</div>
      <div class="chips"><span class="chip">nfc</span><span class="chip">subghz</span><span class="chip">storage</span><span class="chip">over BLE</span></div>
    </div>
  </div>
</body></html>
