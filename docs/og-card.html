<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:
      radial-gradient(700px 380px at 28% 20%, rgba(158,232,79,.18), transparent 60%),
      radial-gradient(500px 400px at 96% 90%, rgba(255,155,61,.10), transparent 60%),
      #0a0c08;
    color:#dde7cb;font-family:'Spline Sans Mono',monospace;position:relative}
  body::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.16) 3px 4px)}
  .grid{position:absolute;inset:0;display:flex;align-items:center;gap:60px;padding:0 90px;z-index:2}
  .logo{flex:0 0 auto;width:300px;height:300px;filter:drop-shadow(0 0 40px rgba(158,232,79,.4))}
  .txt{flex:1}
  .word{font-family:'Silkscreen';font-weight:700;font-size:104px;letter-spacing:2px;color:#eef3e2;
    text-shadow:0 0 40px rgba(158,232,79,.3);line-height:1}
  .word .u{color:#ff9b3d}
  .tag{font-size:34px;color:#c7f06a;margin-top:26px;font-weight:500;line-height:1.25}
  .sub{font-size:23px;color:#869371;margin-top:18px}
  .chips{margin-top:26px;display:flex;gap:12px}
  .chip{border:1px solid #2a3718;border-radius:8px;padding:8px 16px;font-size:20px;color:#9ee84f}
</style></head>
<body>
  <div class="grid">
    <svg class="logo" viewBox="0 0 240 240">
      <rect x="20" y="20" width="200" height="200" rx="30" fill="#10140c" stroke="#5f7a36" stroke-width="5"/>
      <line x1="20" y1="58" x2="220" y2="58" stroke="#2b3a18" stroke-width="3"/>
      <circle cx="44" cy="39" r="6" fill="#7fd13b"/><circle cx="66" cy="39" r="6" fill="#3f5424"/><circle cx="88" cy="39" r="6" fill="#3f5424"/>
      <g stroke="#9ee84f" stroke-width="15" stroke-linecap="round" fill="none">
        <path d="M70 96 L150 138"/><path d="M70 180 L150 138"/></g>
      <circle cx="64" cy="92" r="13" fill="none" stroke="#7fd13b" stroke-width="9"/>
      <circle cx="64" cy="184" r="13" fill="none" stroke="#7fd13b" stroke-width="9"/>
      <circle cx="118" cy="138" r="9" fill="#10140c" stroke="#c7f06a" stroke-width="6"/>
      <rect x="165" y="150" width="34" height="16" rx="3" fill="#ff9b3d"/>
    </svg>
    <div class="txt">
      <div class="word">clipper<span class="u">_</span></div>
      <div class="tag">The Flipper Zero CLI — over Bluetooth.</div>
      <div class="sub">Like screen /dev/cu.usbmodem*, but cordless.</div>
      <div class="chips"><span class="chip">nfc</span><span class="chip">subghz</span><span class="chip">storage</span><span class="chip">over BLE</span></div>
    </div>
  </div>
</body></html>
