<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="clipper logo">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7f06a"/>
      <stop offset="1" stop-color="#7fd13b"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="20" y="20" width="200" height="200" rx="30"
        fill="#10140c" stroke="#5f7a36" stroke-width="5"/>
  <!-- title bar -->
  <line x1="20" y1="58" x2="220" y2="58" stroke="#2b3a18" stroke-width="3"/>
  <circle cx="44" cy="39" r="6" fill="#7fd13b"/>
  <circle cx="66" cy="39" r="6" fill="#3f5424"/>
  <circle cx="88" cy="39" r="6" fill="#3f5424"/>

  <!-- shears = the prompt chevron. Two open blades pivoting to a point. -->
  <g stroke="url(#blade)" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M70 96 L150 138"/>   <!-- upper blade -->
    <path d="M70 180 L150 138"/>  <!-- lower blade -->
  </g>
  <!-- handle loops -->
  <circle cx="64" cy="92" r="13" fill="none" stroke="#7fd13b" stroke-width="9"/>
  <circle cx="64" cy="184" r="13" fill="none" stroke="#7fd13b" stroke-width="9"/>
  <!-- pivot rivet -->
  <circle cx="118" cy="138" r="9" fill="#10140c" stroke="#c7f06a" stroke-width="6"/>

  <!-- cursor block (amber) -->
  <rect x="165" y="150" width="34" height="16" rx="3" fill="#ff9b3d"/>
</svg>
