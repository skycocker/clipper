[package]
name = "clipper"
version = "0.1.0"
edition = "2021"
description = "Interactive Flipper Zero CLI shell over Bluetooth"
license = "MIT"
repository = "https://github.com/skycocker/clipper"

[dependencies]
anyhow = "1"
btleplug = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
