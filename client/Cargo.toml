[package]
name = "clipper"
version = "0.1.0"
edition = "2021"
description = "Interactive Flipper Zero CLI shell over Bluetooth"
license = "MIT"
repository = "https://github.com/skycocker/clipper"

[dependencies]
anyhow = "1"
btleplug = "0.11"
crossterm = "0.28"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync", "signal", "time"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
